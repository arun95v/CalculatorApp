name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q CalculatorApp-project.zip -d extracted
          echo "Project contents:"
          find extracted -maxdepth 3 -type f

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Configure Java 17 and Kotlin 17
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace(
              """android {
    namespace 'com.example.calculator'
""",
              """android {
    namespace 'com.example.calculator'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
"""
          )

          p.write_text(s)
          PY

          echo "Updated app/build.gradle:"
          cat app/build.gradle

      - name: Build APK
        working-directory: extracted
        run: |
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          ls -lh extracted/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
